<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="720" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Content Area Background -->
  <rect x="0" y="0" width="1200" height="720" fill="#1a1a1a"/>

  <!-- Transmission Analytics Dashboard Content -->

  <!-- Top Section: Current Status -->
  <g id="current_status">
    <!-- Current Gear Display -->
    <rect x="20" y="20" width="200" height="140" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="120" y="40" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Current Gear</text>

    <!-- Large Gear Indicator -->
    <circle cx="120" cy="100" r="30" fill="#4299e1" stroke="#63b3ed" stroke-width="3"/>
    <text x="120" y="110" fill="#ffffff" font-family="monospace" font-size="32" font-weight="bold" text-anchor="middle">D4</text>
    <text x="120" y="135" fill="#9ca3af" font-family="monospace" font-size="10" text-anchor="middle">Auto Mode</text>

    <!-- Gear Ratio -->
    <rect x="240" y="20" width="200" height="140" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="340" y="40" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Gear Ratio</text>
    <text x="340" y="80" fill="#4299e1" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">1.00:1</text>
    <text x="340" y="100" fill="#9ca3af" font-family="monospace" font-size="11" text-anchor="middle">4th Gear</text>
    <text x="340" y="120" fill="#d1d5db" font-family="monospace" font-size="10" text-anchor="middle">Target: 1.00:1</text>
    <text x="340" y="135" fill="#68d391" font-family="monospace" font-size="10" text-anchor="middle">Locked</text>

    <!-- Shift Pattern -->
    <rect x="460" y="20" width="300" height="140" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="470" y="40" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Shift Pattern</text>

    <!-- Gear progression display -->
    <text x="470" y="60" fill="#9ca3af" font-family="monospace" font-size="10">Recent Shifts:</text>
    <text x="470" y="75" fill="#68d391" font-family="monospace" font-size="10">P → D → 1st → 2nd → 3rd → 4th</text>
    <text x="470" y="95" fill="#d1d5db" font-family="monospace" font-size="10">Next upshift at: 2800 RPM</text>
    <text x="470" y="110" fill="#d1d5db" font-family="monospace" font-size="10">Downshift at: 1200 RPM</text>
    <text x="470" y="125" fill="#fbbf24" font-family="monospace" font-size="10">Adaptive: Learning</text>
    <text x="470" y="140" fill="#d1d5db" font-family="monospace" font-size="10">Economy mode active</text>

    <!-- Torque Converter -->
    <rect x="780" y="20" width="200" height="140" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="880" y="40" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Torque Converter</text>

    <!-- TC Status Indicator -->
    <circle cx="880" cy="75" r="20" fill="#68d391" stroke="#81c784" stroke-width="2"/>
    <text x="880" y="80" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">L</text>
    <text x="880" y="105" fill="#68d391" font-family="monospace" font-size="11" text-anchor="middle">Locked</text>
    <text x="880" y="120" fill="#d1d5db" font-family="monospace" font-size="10" text-anchor="middle">Slip: 0 RPM</text>
    <text x="880" y="135" fill="#d1d5db" font-family="monospace" font-size="10" text-anchor="middle">Duty: 95%</text>

    <!-- Speed Display -->
    <rect x="1000" y="20" width="180" height="140" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="1090" y="40" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Speeds</text>

    <text x="1010" y="60" fill="#d1d5db" font-family="monospace" font-size="10">Input: 2450 RPM</text>
    <text x="1010" y="75" fill="#d1d5db" font-family="monospace" font-size="10">Output: 2450 RPM</text>
    <text x="1010" y="90" fill="#4299e1" font-family="monospace" font-size="10">Vehicle: 55 mph</text>
    <text x="1010" y="105" fill="#d1d5db" font-family="monospace" font-size="10">Ratio: 1.000</text>
    <text x="1010" y="120" fill="#68d391" font-family="monospace" font-size="10">Status: Normal</text>
  </g>

  <!-- Middle Section: Fluid & Pressure -->
  <g id="fluid_pressure">
    <rect x="20" y="180" width="760" height="140" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="30" y="200" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Transmission Fluid &amp; Pressure</text>

    <!-- Fluid Temperature -->
    <text x="30" y="225" fill="#d1d5db" font-family="monospace" font-size="11">Fluid Temperature:</text>
    <rect x="200" y="215" width="150" height="15" fill="#374151"/>
    <rect x="200" y="215" width="90" height="15" fill="#68d391"/>
    <text x="360" y="227" fill="#68d391" font-family="monospace" font-size="11" font-weight="bold">82°C (180°F)</text>

    <!-- Pressure Readings -->
    <text x="30" y="250" fill="#d1d5db" font-family="monospace" font-size="11">Line Pressure:</text>
    <text x="150" y="250" fill="#4299e1" font-family="monospace" font-size="11" font-weight="bold">1250 kPa</text>
    <text x="250" y="250" fill="#d1d5db" font-family="monospace" font-size="11">Target: 1225 kPa</text>

    <text x="30" y="265" fill="#d1d5db" font-family="monospace" font-size="11">Clutch Pressure:</text>
    <text x="150" y="265" fill="#4299e1" font-family="monospace" font-size="11" font-weight="bold">980 kPa</text>
    <text x="250" y="265" fill="#d1d5db" font-family="monospace" font-size="11">Modulated</text>

    <!-- Solenoid Status Grid -->
    <text x="400" y="225" fill="#d1d5db" font-family="monospace" font-size="11">Solenoid Status:</text>

    <!-- Solenoid Grid -->
    <rect x="400" y="235" width="50" height="20" fill="#68d391"/>
    <text x="425" y="248" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">SS1</text>

    <rect x="455" y="235" width="50" height="20" fill="#374151"/>
    <text x="480" y="248" fill="#9ca3af" font-family="monospace" font-size="9" text-anchor="middle">SS2</text>

    <rect x="510" y="235" width="50" height="20" fill="#68d391"/>
    <text x="535" y="248" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">SS3</text>

    <rect x="565" y="235" width="50" height="20" fill="#68d391"/>
    <text x="590" y="248" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">TCC</text>

    <!-- Clutch Status -->
    <text x="30" y="285" fill="#d1d5db" font-family="monospace" font-size="11">Clutch Slip:</text>
    <text x="120" y="285" fill="#68d391" font-family="monospace" font-size="11" font-weight="bold">0 RPM</text>
    <text x="180" y="285" fill="#d1d5db" font-family="monospace" font-size="11">(No Slip)</text>

    <text x="30" y="300" fill="#d1d5db" font-family="monospace" font-size="11">Apply Pressure:</text>
    <text x="150" y="300" fill="#4299e1" font-family="monospace" font-size="11" font-weight="bold">C1: 1180 kPa</text>
    <text x="270" y="300" fill="#4299e1" font-family="monospace" font-size="11" font-weight="bold">C2: 1150 kPa</text>
  </g>

  <!-- Right Column: Adaptive Learning -->
  <g id="adaptive_learning">
    <rect x="800" y="180" width="380" height="140" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="810" y="200" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Adaptive Learning</text>

    <!-- Learning Status -->
    <text x="810" y="220" fill="#d1d5db" font-family="monospace" font-size="11">Learning Status:</text>
    <text x="930" y="220" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">Active</text>

    <!-- Shift Quality Metrics -->
    <text x="810" y="240" fill="#d1d5db" font-family="monospace" font-size="11">Shift Quality:</text>
    <text x="810" y="255" fill="#68d391" font-family="monospace" font-size="10">1-2: Smooth</text>
    <text x="890" y="255" fill="#68d391" font-family="monospace" font-size="10">2-3: Smooth</text>
    <text x="970" y="255" fill="#68d391" font-family="monospace" font-size="10">3-4: Smooth</text>

    <!-- Adaptation Values -->
    <text x="810" y="275" fill="#d1d5db" font-family="monospace" font-size="11">Adaptations:</text>
    <text x="810" y="290" fill="#4299e1" font-family="monospace" font-size="10">1-2 Shift: +5ms</text>
    <text x="910" y="290" fill="#4299e1" font-family="monospace" font-size="10">2-3 Shift: +2ms</text>
    <text x="810" y="305" fill="#4299e1" font-family="monospace" font-size="10">3-4 Shift: +3ms</text>
    <text x="910" y="305" fill="#4299e1" font-family="monospace" font-size="10">TCC Lock: -1ms</text>
  </g>

  <!-- Bottom Section: Charts and History -->
  <g id="charts_history">
    <!-- Shift History Chart -->
    <rect x="20" y="340" width="580" height="160" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="30" y="360" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Shift Pattern History</text>

    <!-- Chart Area -->
    <rect x="30" y="370" width="560" height="120" fill="#1a1a1a" stroke="#374151" stroke-width="1"/>

    <!-- Gear indication over time -->
    <text x="35" y="385" fill="#9ca3af" font-family="monospace" font-size="9">Gear Selection (Last 2 minutes)</text>

    <!-- Gear level indicators -->
    <line x1="35" y1="400" x2="580" y2="400" stroke="#374151" stroke-width="1"/>
    <line x1="35" y1="430" x2="580" y2="430" stroke="#374151" stroke-width="1"/>
    <line x1="35" y1="460" x2="580" y2="460" stroke="#374151" stroke-width="1"/>

    <text x="590" y="405" fill="#9ca3af" font-family="monospace" font-size="8">4th</text>
    <text x="590" y="435" fill="#9ca3af" font-family="monospace" font-size="8">3rd</text>
    <text x="590" y="465" fill="#9ca3af" font-family="monospace" font-size="8">2nd</text>

    <!-- Stepped line showing gear changes -->
    <polyline points="35,400 120,400 125,430 180,430 185,400 280,400 285,460 320,460 325,430 380,430 385,400 580,400"
              fill="none" stroke="#4299e1" stroke-width="3"/>

    <!-- Performance Metrics -->
    <rect x="620" y="340" width="280" height="160" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="630" y="360" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Performance Metrics</text>

    <!-- Shift Times -->
    <text x="630" y="380" fill="#d1d5db" font-family="monospace" font-size="11">Average Shift Times:</text>
    <text x="630" y="395" fill="#68d391" font-family="monospace" font-size="10">1-2: 0.65s</text>
    <text x="720" y="395" fill="#68d391" font-family="monospace" font-size="10">2-3: 0.58s</text>
    <text x="630" y="410" fill="#68d391" font-family="monospace" font-size="10">3-4: 0.62s</text>
    <text x="720" y="410" fill="#68d391" font-family="monospace" font-size="10">TCC: 0.45s</text>

    <!-- Efficiency Metrics -->
    <text x="630" y="435" fill="#d1d5db" font-family="monospace" font-size="11">Efficiency:</text>
    <text x="630" y="450" fill="#4299e1" font-family="monospace" font-size="10">Torque Transfer: 96.8%</text>
    <text x="630" y="465" fill="#4299e1" font-family="monospace" font-size="10">Parasitic Loss: 3.2%</text>

    <!-- Temperature History -->
    <text x="630" y="485" fill="#d1d5db" font-family="monospace" font-size="11">Temperature Trend: Stable</text>
  </g>

  <!-- Warning Panel -->
  <g id="warnings">
    <rect x="920" y="340" width="260" height="160" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="930" y="360" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">System Status</text>

    <!-- Status Indicators -->
    <circle cx="940" cy="380" r="5" fill="#68d391"/>
    <text x="955" y="385" fill="#68d391" font-family="monospace" font-size="10">Transmission Normal</text>

    <circle cx="940" cy="400" r="5" fill="#68d391"/>
    <text x="955" y="405" fill="#68d391" font-family="monospace" font-size="10">Fluid Level OK</text>

    <circle cx="940" cy="420" r="5" fill="#68d391"/>
    <text x="955" y="425" fill="#68d391" font-family="monospace" font-size="10">Pressure Normal</text>

    <circle cx="940" cy="440" r="5" fill="#fbbf24"/>
    <text x="955" y="445" fill="#fbbf24" font-family="monospace" font-size="10">Learning Active</text>

    <circle cx="940" cy="460" r="5" fill="#68d391"/>
    <text x="955" y="465" fill="#68d391" font-family="monospace" font-size="10">Solenoids OK</text>

    <text x="930" y="485" fill="#9ca3af" font-family="monospace" font-size="9">No DTCs • Update: 0.1s</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <rect x="20" y="520" width="1160" height="40" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="30" y="540" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">Legend:</text>

    <circle cx="120" cy="535" r="4" fill="#68d391"/>
    <text x="130" y="540" fill="#68d391" font-family="monospace" font-size="10">Normal/Good</text>

    <circle cx="220" cy="535" r="4" fill="#4299e1"/>
    <text x="230" y="540" fill="#4299e1" font-family="monospace" font-size="10">Active/Data</text>

    <circle cx="320" cy="535" r="4" fill="#fbbf24"/>
    <text x="330" y="540" fill="#fbbf24" font-family="monospace" font-size="10">Warning/Learning</text>

    <circle cx="450" cy="535" r="4" fill="#f56565"/>
    <text x="460" y="540" fill="#f56565" font-family="monospace" font-size="10">Error/Critical</text>

    <text x="600" y="540" fill="#9ca3af" font-family="monospace" font-size="10">[TAB] Next Panel • [F1] Help • [Q] Quit</text>
  </g>
</svg>