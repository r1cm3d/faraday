<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="720" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Content Area Background -->
  <rect x="0" y="0" width="1200" height="720" fill="#1a1a1a"/>

  <!-- Safety Systems Status Dashboard Content -->

  <!-- Top Section: ABS/ESC System -->
  <g id="abs_esc_system">
    <rect x="20" y="20" width="580" height="200" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="30" y="40" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">ABS / ESC System</text>

    <!-- Wheel Speed Sensors -->
    <text x="30" y="65" fill="#d1d5db" font-family="monospace" font-size="12" font-weight="bold">Wheel Speed Sensors (km/h):</text>

    <!-- Vehicle diagram with wheels -->
    <g id="vehicle_diagram">
      <!-- Vehicle outline -->
      <rect x="250" y="80" width="100" height="60" fill="none" stroke="#4a5568" stroke-width="2" rx="5"/>

      <!-- Front wheels -->
      <circle cx="260" cy="95" r="12" fill="#374151" stroke="#4a5568" stroke-width="2"/>
      <text x="260" y="100" fill="#68d391" font-family="monospace" font-size="9" text-anchor="middle">55.2</text>

      <circle cx="340" cy="95" r="12" fill="#374151" stroke="#4a5568" stroke-width="2"/>
      <text x="340" y="100" fill="#68d391" font-family="monospace" font-size="9" text-anchor="middle">55.1</text>

      <!-- Rear wheels -->
      <circle cx="260" cy="125" r="12" fill="#374151" stroke="#4a5568" stroke-width="2"/>
      <text x="260" y="130" fill="#68d391" font-family="monospace" font-size="9" text-anchor="middle">54.9</text>

      <circle cx="340" cy="125" r="12" fill="#374151" stroke="#4a5568" stroke-width="2"/>
      <text x="340" y="130" fill="#68d391" font-family="monospace" font-size="9" text-anchor="middle">55.0</text>

      <!-- Labels -->
      <text x="220" y="100" fill="#9ca3af" font-family="monospace" font-size="8">FL</text>
      <text x="355" y="100" fill="#9ca3af" font-family="monospace" font-size="8">FR</text>
      <text x="220" y="130" fill="#9ca3af" font-family="monospace" font-size="8">RL</text>
      <text x="355" y="130" fill="#9ca3af" font-family="monospace" font-size="8">RR</text>
    </g>

    <!-- Brake Pressure Distribution -->
    <text x="380" y="80" fill="#d1d5db" font-family="monospace" font-size="11">Brake Pressure (bar):</text>
    <text x="380" y="95" fill="#4299e1" font-family="monospace" font-size="10">Front: 45.2</text>
    <text x="470" y="95" fill="#4299e1" font-family="monospace" font-size="10">Rear: 38.7</text>
    <text x="380" y="110" fill="#d1d5db" font-family="monospace" font-size="10">Master Cylinder: 52.1 bar</text>
    <text x="380" y="125" fill="#68d391" font-family="monospace" font-size="10">Proportioning: Normal</text>

    <!-- System Status -->
    <text x="30" y="160" fill="#d1d5db" font-family="monospace" font-size="11">System Status:</text>
    <circle cx="140" cy="155" r="4" fill="#68d391"/>
    <text x="150" y="160" fill="#68d391" font-family="monospace" font-size="10">ABS Ready</text>

    <circle cx="240" cy="155" r="4" fill="#68d391"/>
    <text x="250" y="160" fill="#68d391" font-family="monospace" font-size="10">ESC Active</text>

    <text x="30" y="180" fill="#d1d5db" font-family="monospace" font-size="11">Interventions:</text>
    <text x="130" y="180" fill="#4299e1" font-family="monospace" font-size="10">ESC: 0 events</text>
    <text x="250" y="180" fill="#4299e1" font-family="monospace" font-size="10">ABS: 0 events</text>

    <!-- Yaw Rate Display -->
    <text x="380" y="160" fill="#d1d5db" font-family="monospace" font-size="11">Vehicle Dynamics:</text>
    <text x="380" y="175" fill="#4299e1" font-family="monospace" font-size="10">Yaw Rate: +2.1°/s</text>
    <text x="380" y="190" fill="#4299e1" font-family="monospace" font-size="10">Lateral G: +0.15g</text>
    <text x="380" y="205" fill="#68d391" font-family="monospace" font-size="10">Stability: Normal</text>
  </g>

  <!-- Top Right: Airbag System (RCM) -->
  <g id="airbag_system">
    <rect x="620" y="20" width="560" height="200" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="630" y="40" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Airbag System (RCM)</text>

    <!-- Airbag Status Grid -->
    <text x="630" y="65" fill="#d1d5db" font-family="monospace" font-size="12" font-weight="bold">Airbag Status:</text>

    <!-- Driver airbag -->
    <rect x="640" y="75" width="80" height="25" fill="#68d391" stroke="#81c784" stroke-width="1" rx="3"/>
    <text x="680" y="90" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">Driver</text>
    <text x="680" y="100" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">Ready</text>

    <!-- Passenger airbag -->
    <rect x="730" y="75" width="80" height="25" fill="#68d391" stroke="#81c784" stroke-width="1" rx="3"/>
    <text x="770" y="90" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">Passenger</text>
    <text x="770" y="100" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">Ready</text>

    <!-- Side airbags -->
    <rect x="820" y="75" width="80" height="25" fill="#68d391" stroke="#81c784" stroke-width="1" rx="3"/>
    <text x="860" y="90" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">Side L</text>
    <text x="860" y="100" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">Ready</text>

    <rect x="910" y="75" width="80" height="25" fill="#68d391" stroke="#81c784" stroke-width="1" rx="3"/>
    <text x="950" y="90" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">Side R</text>
    <text x="950" y="100" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">Ready</text>

    <!-- Curtain airbags -->
    <rect x="1000" y="75" width="80" height="25" fill="#68d391" stroke="#81c784" stroke-width="1" rx="3"/>
    <text x="1040" y="90" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">Curtain</text>
    <text x="1040" y="100" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">Ready</text>

    <!-- Knee airbag -->
    <rect x="1090" y="75" width="80" height="25" fill="#68d391" stroke="#81c784" stroke-width="1" rx="3"/>
    <text x="1130" y="90" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle">Knee</text>
    <text x="1130" y="100" fill="#ffffff" font-family="monospace" font-size="8" text-anchor="middle">Ready</text>

    <!-- Crash Sensors -->
    <text x="630" y="125" fill="#d1d5db" font-family="monospace" font-size="11">Crash Sensors:</text>
    <text x="630" y="140" fill="#68d391" font-family="monospace" font-size="10">Front Impact: 0.02g</text>
    <text x="630" y="155" fill="#68d391" font-family="monospace" font-size="10">Side Impact L: 0.01g</text>
    <text x="630" y="170" fill="#68d391" font-family="monospace" font-size="10">Side Impact R: 0.01g</text>

    <!-- Occupancy Detection -->
    <text x="800" y="125" fill="#d1d5db" font-family="monospace" font-size="11">Occupancy:</text>
    <text x="800" y="140" fill="#68d391" font-family="monospace" font-size="10">Driver: Detected (75kg)</text>
    <text x="800" y="155" fill="#fbbf24" font-family="monospace" font-size="10">Passenger: Empty</text>
    <text x="800" y="170" fill="#68d391" font-family="monospace" font-size="10">Rear L: Detected</text>

    <!-- Seatbelt Status -->
    <text x="980" y="125" fill="#d1d5db" font-family="monospace" font-size="11">Seatbelts:</text>
    <circle cx="1000" cy="135" r="4" fill="#68d391"/>
    <text x="1010" y="140" fill="#68d391" font-family="monospace" font-size="10">Driver: Fastened</text>
    <circle cx="1000" cy="150" r="4" fill="#f56565"/>
    <text x="1010" y="155" fill="#f56565" font-family="monospace" font-size="10">Passenger: Not fastened</text>
    <circle cx="1000" cy="165" r="4" fill="#68d391"/>
    <text x="1010" y="170" fill="#68d391" font-family="monospace" font-size="10">Rear: Fastened</text>

    <!-- System Status -->
    <text x="630" y="195" fill="#d1d5db" font-family="monospace" font-size="11">System: </text>
    <text x="690" y="195" fill="#68d391" font-family="monospace" font-size="11" font-weight="bold">All Systems Ready</text>
    <text x="630" y="210" fill="#9ca3af" font-family="monospace" font-size="10">Self-test: Pass • Warning Lamp: Off</text>
  </g>

  <!-- Middle Section: ADAS Systems -->
  <g id="adas_systems">
    <rect x="20" y="240" width="780" height="180" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="30" y="260" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Advanced Driver Assistance Systems</text>

    <!-- Parking Aid (PAM) -->
    <text x="30" y="285" fill="#d1d5db" font-family="monospace" font-size="12" font-weight="bold">Parking Aid System (PAM):</text>

    <!-- Ultrasonic Sensors -->
    <text x="30" y="305" fill="#d1d5db" font-family="monospace" font-size="11">Ultrasonic Sensors (cm):</text>

    <!-- Sensor readings -->
    <text x="30" y="320" fill="#d1d5db" font-family="monospace" font-size="10">Front:</text>
    <text x="80" y="320" fill="#68d391" font-family="monospace" font-size="10">FL: 255</text>
    <text x="140" y="320" fill="#68d391" font-family="monospace" font-size="10">FC: 255</text>
    <text x="200" y="320" fill="#68d391" font-family="monospace" font-size="10">FR: 255</text>

    <text x="30" y="335" fill="#d1d5db" font-family="monospace" font-size="10">Rear:</text>
    <text x="80" y="335" fill="#68d391" font-family="monospace" font-size="10">RL: 180</text>
    <text x="140" y="335" fill="#fbbf24" font-family="monospace" font-size="10">RC: 85</text>
    <text x="200" y="335" fill="#68d391" font-family="monospace" font-size="10">RR: 210</text>

    <!-- Camera Status -->
    <text x="300" y="305" fill="#d1d5db" font-family="monospace" font-size="11">Backup Camera:</text>
    <circle cx="420" cy="300" r="4" fill="#68d391"/>
    <text x="430" y="305" fill="#68d391" font-family="monospace" font-size="10">Active</text>

    <text x="300" y="320" fill="#d1d5db" font-family="monospace" font-size="10">Resolution: 480p</text>
    <text x="300" y="335" fill="#d1d5db" font-family="monospace" font-size="10">Frame Rate: 30 FPS</text>

    <!-- Lane Detection (if equipped) -->
    <text x="30" y="365" fill="#d1d5db" font-family="monospace" font-size="12" font-weight="bold">Lane Departure Warning:</text>
    <text x="30" y="380" fill="#9ca3af" font-family="monospace" font-size="10">Status: Not Equipped</text>

    <!-- Blind Spot Monitoring -->
    <text x="300" y="365" fill="#d1d5db" font-family="monospace" font-size="12" font-weight="bold">Blind Spot Detection:</text>
    <text x="300" y="380" fill="#68d391" font-family="monospace" font-size="10">Left: Clear</text>
    <text x="380" y="380" fill="#68d391" font-family="monospace" font-size="10">Right: Clear</text>
    <text x="300" y="395" fill="#d1d5db" font-family="monospace" font-size="10">Range: 6m • Sensitivity: Normal</text>

    <!-- Adaptive Cruise Control -->
    <text x="520" y="285" fill="#d1d5db" font-family="monospace" font-size="12" font-weight="bold">Adaptive Cruise Control:</text>
    <text x="520" y="305" fill="#9ca3af" font-family="monospace" font-size="10">Status: Not Equipped</text>

    <!-- Forward Collision Warning -->
    <text x="520" y="330" fill="#d1d5db" font-family="monospace" font-size="12" font-weight="bold">Collision Avoidance:</text>
    <text x="520" y="350" fill="#9ca3af" font-family="monospace" font-size="10">Pre-Collision: Not Equipped</text>
    <text x="520" y="365" fill="#9ca3af" font-family="monospace" font-size="10">Auto Emergency Brake: Not Equipped</text>
  </g>

  <!-- Right Panel: System Diagnostics -->
  <g id="system_diagnostics">
    <rect x="820" y="240" width="360" height="180" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="830" y="260" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">System Diagnostics</text>

    <!-- Module Communication -->
    <text x="830" y="285" fill="#d1d5db" font-family="monospace" font-size="11">Module Communication:</text>
    <circle cx="850" cy="300" r="4" fill="#68d391"/>
    <text x="860" y="305" fill="#68d391" font-family="monospace" font-size="10">ABS Module: Online</text>

    <circle cx="850" cy="315" r="4" fill="#68d391"/>
    <text x="860" y="320" fill="#68d391" font-family="monospace" font-size="10">RCM Module: Online</text>

    <circle cx="850" cy="330" r="4" fill="#68d391"/>
    <text x="860" y="335" fill="#68d391" font-family="monospace" font-size="10">PAM Module: Online</text>

    <circle cx="850" cy="345" r="4" fill="#68d391"/>
    <text x="860" y="350" fill="#68d391" font-family="monospace" font-size="10">PSCM Module: Online</text>

    <!-- Self-Test Results -->
    <text x="830" y="375" fill="#d1d5db" font-family="monospace" font-size="11">Self-Test Results:</text>
    <text x="830" y="390" fill="#68d391" font-family="monospace" font-size="10">ABS: Pass</text>
    <text x="890" y="390" fill="#68d391" font-family="monospace" font-size="10">Airbags: Pass</text>
    <text x="830" y="405" fill="#68d391" font-family="monospace" font-size="10">Sensors: Pass</text>
    <text x="890" y="405" fill="#68d391" font-family="monospace" font-size="10">Cameras: Pass</text>
  </g>

  <!-- Bottom Section: Real-time Monitoring -->
  <g id="realtime_monitoring">
    <rect x="20" y="440" width="1160" height="120" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="30" y="460" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Real-time Safety Monitoring</text>

    <!-- Chart Area for Sensor Data -->
    <rect x="30" y="470" width="500" height="80" fill="#1a1a1a" stroke="#374151" stroke-width="1"/>
    <text x="35" y="485" fill="#9ca3af" font-family="monospace" font-size="9">Sensor Activity (Last 30 seconds)</text>

    <!-- Simulated sensor activity lines -->
    <polyline points="35,520 80,518 125,522 170,519 215,521 260,520 305,518 350,522 395,520 440,519 485,521 525,520"
              fill="none" stroke="#68d391" stroke-width="2"/>
    <polyline points="35,530 80,528 125,532 170,529 215,531 260,530 305,528 350,532 395,530 440,529 485,531 525,530"
              fill="none" stroke="#4299e1" stroke-width="2"/>

    <text x="35" y="500" fill="#68d391" font-family="monospace" font-size="9">ABS Activity</text>
    <text x="120" y="500" fill="#4299e1" font-family="monospace" font-size="9">ESC Interventions</text>

    <!-- Alert Panel -->
    <rect x="560" y="470" width="300" height="80" fill="#1a1a1a" stroke="#374151" stroke-width="1"/>
    <text x="570" y="485" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">Active Alerts</text>

    <text x="570" y="505" fill="#fbbf24" font-family="monospace" font-size="10">⚠ Passenger seatbelt not fastened</text>
    <text x="570" y="520" fill="#4299e1" font-family="monospace" font-size="10">ℹ Parking aid detecting object</text>
    <text x="570" y="535" fill="#68d391" font-family="monospace" font-size="10">✓ All other systems normal</text>

    <!-- Performance Stats -->
    <rect x="880" y="470" width="300" height="80" fill="#1a1a1a" stroke="#374151" stroke-width="1"/>
    <text x="890" y="485" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">Performance Statistics</text>

    <text x="890" y="505" fill="#d1d5db" font-family="monospace" font-size="10">ABS Activations: 0 (this trip)</text>
    <text x="890" y="520" fill="#d1d5db" font-family="monospace" font-size="10">ESC Interventions: 0 (this trip)</text>
    <text x="890" y="535" fill="#d1d5db" font-family="monospace" font-size="10">System Uptime: 00:45:32</text>
  </g>

  <!-- Bottom Status Bar -->
  <g id="status_bar">
    <rect x="20" y="580" width="1160" height="40" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="30" y="600" fill="#68d391" font-family="monospace" font-size="11">Safety Systems: All Online • DTCs: 0 • Last Update: 0.1s ago</text>

    <text x="800" y="600" fill="#9ca3af" font-family="monospace" font-size="10">[TAB] Next Panel • [R] Reset Counters • [F1] Help • [Q] Quit</text>
  </g>

  <!-- Legend -->
  <g id="legend">
    <rect x="20" y="640" width="1160" height="40" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="5"/>
    <text x="30" y="660" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">Status Legend:</text>

    <circle cx="140" cy="655" r="4" fill="#68d391"/>
    <text x="150" y="660" fill="#68d391" font-family="monospace" font-size="10">Ready/Normal</text>

    <circle cx="240" cy="655" r="4" fill="#4299e1"/>
    <text x="250" y="660" fill="#4299e1" font-family="monospace" font-size="10">Active/Data</text>

    <circle cx="340" cy="655" r="4" fill="#fbbf24"/>
    <text x="350" y="660" fill="#fbbf24" font-family="monospace" font-size="10">Warning</text>

    <circle cx="420" cy="655" r="4" fill="#f56565"/>
    <text x="430" y="660" fill="#f56565" font-family="monospace" font-size="10">Error/Fault</text>

    <circle cx="510" cy="655" r="4" fill="#9ca3af"/>
    <text x="520" y="660" fill="#9ca3af" font-family="monospace" font-size="10">Not Equipped</text>
  </g>
</svg>