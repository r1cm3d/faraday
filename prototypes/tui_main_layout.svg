  <rect x="345" y="45" width="100" height="25" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <text x="395" y="62" fill="#d1d5db" font-family="monospace" font-size="11" text-anchor="middle">Safety</text>

  <rect x="450" y="45" width="100" height="25" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <text x="500" y="62" fill="#d1d5db" font-family="monospace" font-size="11" text-anchor="middle">ADAS</text>

  <rect x="555" y="45" width="100" height="25" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <text x="605" y="62" fill="#d1d5db" font-family="monospace" font-size="11" text-anchor="middle">Climate</text>

  <rect x="660" y="45" width="100" height="25" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <text x="710" y="62" fill="#d1d5db" font-family="monospace" font-size="11" text-anchor="middle">Comm</text>

  <rect x="765" y="45" width="100" height="25" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <text x="815" y="62" fill="#d1d5db" font-family="monospace" font-size="11" text-anchor="middle">Analytics</text>

  <rect x="870" y="45" width="100" height="25" fill="#374151" stroke="#4b5563" stroke-width="1"/>
