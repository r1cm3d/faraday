  <!-- Status Bar at bottom -->
  <rect x="0" y="760" width="1200" height="40" fill="#2d3748"/>
  <text x="20" y="782" fill="#68d391" font-family="monospace" font-size="11">PCM: Connected • Update Rate: 10Hz • Data Points: 127 • Last Update: 0.1s ago</text>
